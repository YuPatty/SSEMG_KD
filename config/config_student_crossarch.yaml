# config_student_crossarch.yaml
# 跨架構 student：用 StudentSSEMGNet（depthwise separable conv，無 mamba_ssm 依賴）
# dense_channel 維持 32（可再調），num_tscblocks=2（對應 TSConvBlock 層數）

exp:
  name: v19_tt_mask_student_crossarch
train:
  epochs: 30
  batch_size: 4
  accum: 4
  lr: 3.0e-4
  clip_grad: 5.0

model:
  fea: "pha"
  norm: False
  fmamba: True          # 語意上代表「頻率軸也建模」，StudentNet 沿用同名 key
  dense_channel: 32
  compress_factor: 0.5
  num_tscblocks: 2
  sampling_rate: 1000
  n_fft: 512
  hop_size: 128
  win_size: 512
  beta: 1.0
  loss_fn: "time+com+con"
  mask_hp_cut_hz: 150.0
  loss_weights:
    time: 0.25
    com : 0.40
    con : 0.25
    mr  : 0.08
    H   : 0.01
  use_gn: True
  gn_groups: 8
  lsig_L2: 5.0e-5

ablation:
  use_mrstft:   True
  use_entropy:  True

input_channels: 2
input_freq_bins: 257
input_time_bins: 79

metrics:
  sampling_rate:    1000
  n_fft:            256
  hop_size:         32
  win_size:         128
  segment_sec:      1
